<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stageshow film — the wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The film, as a page.

         One move, no cuts. It opens inside a single scene, pulls back until that scene is one
         window on a board of eleven, drifts while every window animates, and then fades into the
         Open Graph card — the same image a link preview shows, so the film and the link end in the
         same place. No title card, no end card, no cut.

         Every window is its scene at its own aspect, filmed at native size, so there is no
         letterbox to hide when the camera comes close. */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #08080a;
        color: #f2f0ec;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #board {
        position: absolute;
        inset: 0;
        background: #08080a;
        overflow: hidden;
      }

      #world {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .cell {
        position: absolute;
        overflow: hidden;
        background: #101013;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.07);
      }

      .cell video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Keeps the eye in the middle of the board while twenty-odd square metres of UI move at the
         edges. Not decoration. */
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(120% 90% at 50% 46%, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
      }

      /* The link-preview card, rebuilt rather than pasted, because the owner asked for the gradient
         behind it to drift and a baked PNG cannot drift. The background is the OG's own colours —
         near-black #0b0908, an amber light low-left, a violet light high-right — and the dot mark
         is the OG's mark cropped out and composited back with a screen blend, so the film still
         lands on the same image a link preview shows. */
      #og {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: #0b0908;
        overflow: hidden;
      }

      #og .bg {
        position: absolute;
        inset: -22%;
        will-change: transform;
        background:
          radial-gradient(46% 52% at 12% 88%, rgba(105, 74, 13, 0.85) 0%, rgba(47, 26, 18, 0.55) 42%, transparent 72%),
          radial-gradient(44% 50% at 88% 8%, rgba(58, 37, 80, 0.9) 0%, rgba(30, 21, 39, 0.6) 45%, transparent 74%);
      }

      #og .mark {
        position: absolute;
        left: 50%;
        top: 50%;
        height: 55%;
        aspect-ratio: 369 / 409;
        transform: translate(50%, -50%);
      }

      /* No blend mode: the mark is keyed to dots-on-transparent, so it keeps the card's own cream
         however the light behind it moves. */
      #og .word {
        position: absolute;
        left: 104px;
        top: 178px;
        font-family: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
        font-size: 141px;
        line-height: 0.9;
        letter-spacing: -0.012em;
        color: #f5f1e7;
      }

      #og .sub {
        position: absolute;
        left: 100px;
        top: 528px;
        font-family: ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.22em;
        color: #b8b2a6;
      }

      #og .sub em {
        font-style: normal;
        color: #8a857b;
      }

      #curtain {
        position: absolute;
        inset: 0;
        background: #08080a;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="og">
        <div class="bg"></div>
        <img class="mark" src="og-mark.png" alt="" />
        <div class="word">svelte<br />stageshow</div>
        <div class="sub">A SVELTE 5 PORT OF BENJI TAYLOR'S <em>KIT</em></div>
      </div>
      <!-- The board carries its own background, so it is a layer that can be faded off the card
           underneath rather than a transparent container with the card showing through its gaps. -->
      <div id="board">
        <div id="world"></div>
        <div id="vignette"></div>
      </div>
      <div id="curtain"></div>
    </div>

    <script>
      // Scene, native aspect, and the band it belongs to. Every clip was filmed at the stage's own
      // size, so a cell at the right aspect has nothing to letterbox.
      const SCENES = [
        ['dynamic-island', 640, 400, 0],
        ['chart-scrub', 640, 400, 0],
        ['messages', 420, 340, 0],
        ['phone-touch', 400, 520, 0],
        ['presence', 660, 420, 1],
        ['reorder', 520, 360, 1],
        ['table-edit', 660, 400, 1],
        ['subscriptions', 720, 440, 1],
        ['loading', 600, 400, 2],
        ['form-error', 560, 400, 2],
        ['dark-hero', 760, 440, 2],
      ]

      const ROW_GAP = 46
      const GUTTER = 46
      // One target width for every band, so the board is justified edge to edge. Equal heights
      // with ragged rights reads as a contact sheet; equal widths with heights taken from each
      // aspect reads as a plate.
      const TARGET_W = 1900

      const rows = new Map()
      for (const scene of SCENES) {
        if (!rows.has(scene[3])) rows.set(scene[3], [])
        rows.get(scene[3]).push(scene)
      }

      const bands = [...rows]
        .sort((a, b) => a[0] - b[0])
        .map(([, row]) => {
          const aspects = row.map(([, w, h]) => w / h)
          const sum = aspects.reduce((a, b) => a + b, 0)
          const height = Math.round((TARGET_W - GUTTER * (row.length - 1)) / sum)
          const widths = row.map(([, w, h]) => Math.round((height * w) / h))
          // Absorb rounding into the last cell so each band lands on the target width exactly.
          const slack = TARGET_W - (widths.reduce((a, b) => a + b, 0) + GUTTER * (row.length - 1))
          return { row, widths, height, slack }
        })

      const widest = TARGET_W
      const world = document.getElementById('world')
      const videos = []
      const centre = {}
      let y = 0

      for (const band of bands) {
        let x = 0
        band.row.forEach((scene, i) => {
          const width = band.widths[i] + (i === band.row.length - 1 ? band.slack : 0)
          const el = document.createElement('div')
          el.className = 'cell'
          el.style.cssText = `left:${x}px;top:${y}px;width:${width}px;height:${band.height}px`
          const video = document.createElement('video')
          video.src = `native/${scene[0]}.mp4`
          video.muted = true
          video.loop = true
          video.playsInline = true
          video.preload = 'auto'
          el.append(video)
          world.append(el)
          videos.push(video)
          centre[scene[0]] = [x + width / 2, y + band.height / 2]
          x += width + GUTTER
        })
        y += band.height + ROW_GAP
      }

      const worldH = y - ROW_GAP
      world.style.width = `${widest}px`
      world.style.height = `${worldH}px`
      world.style.margin = `${-worldH / 2}px 0 0 ${-widest / 2}px`

      const W = 1280
      const H = 720
      // Whatever the layout works out to, the board shot is the scale that fills 96% of the frame.
      const FIT = Math.min(W / widest, H / worldH) * 0.96

      // [seconds, scene or null, scale]. A scene name centres on that cell; null centres the board.
      // The opening scene is dark-hero because it is the one stage whose aspect is already near
      // 16:9: at cover it fills the frame at 1.68x, so the first second is the scene as designed
      // rather than a crop of it. The phone scenes only fill the frame at 3x, which is why opening
      // on one read as a white screen with a chat bubble in it.
      const SHOTS = [
        [0.0, 'dark-hero', 1.8],
        [1.1, 'dark-hero', 1.75],
        [4.2, null, FIT * 0.97],
        [7.0, null, FIT * 1.04],
      ]

      // The card comes up out of the dark, and the board goes down into it first. A straight
      // cross-dissolve between a dense grid of UI and a text card has a legible double-exposure
      // midpoint no matter how the curves are shaped; both backgrounds here are within three
      // values of each other, so a dip is invisible and the overlap is only darkness.
      const BOARD_OUT = 7.62
      const CARD_IN = 7.34
      const CARD_FULL = 8.2
      const TOTAL = 10.0

      const EASE = [0.66, 0, 0.34, 1]

      const target = (shot) => {
        if (shot === null) return [widest / 2, worldH / 2, null]
        return [centre[shot][0], centre[shot][1], shot]
      }

      // Bezier easing by bisection: no dependency, and 24 steps is far below a frame of error.
      function ease(p) {
        let lo = 0
        let hi = 1
        let t = p
        for (let i = 0; i < 24; i += 1) {
          t = (lo + hi) / 2
          const x = 3 * (1 - t) * (1 - t) * t * EASE[0] + 3 * (1 - t) * t * t * EASE[2] + t * t * t
          if (x < p) lo = t
          else hi = t
        }
        return 3 * (1 - t) * t * t + t * t * t
      }

      function cameraAt(t) {
        const first = SHOTS[0]
        if (t <= first[0]) {
          const [x, y] = target(first[1])
          return [x, y, first[2]]
        }
        for (let i = 1; i < SHOTS.length; i += 1) {
          const [t1, who1, s1] = SHOTS[i]
          const [t0, who0, s0] = SHOTS[i - 1]
          if (t <= t1) {
            const p = ease((t - t0) / (t1 - t0))
            const [x0, y0] = target(who0)
            const [x1, y1] = target(who1)
            return [x0 + (x1 - x0) * p, y0 + (y1 - y0) * p, s0 + (s1 - s0) * p]
          }
        }
        const last = SHOTS[SHOTS.length - 1]
        const [x, y] = target(last[1])
        return [x, y, last[2]]
      }

      const og = document.getElementById('og')
      const ogBg = og.querySelector('.bg')
      const curtain = document.getElementById('curtain')
      const board = document.getElementById('board')

      function place(t) {
        const [x, y, s] = cameraAt(t)
        // The scale is applied about the world's own centre, so the pan is multiplied by it.
        world.style.transform = `translate3d(${-s * (x - widest / 2)}px, ${-s * (y - worldH / 2)}px, 0) scale(${s})`
        // A straight cross-dissolve between a busy board and a card reads as a double exposure.
        // So the card does not fade in at all — it sits behind the board at full strength and the
        // board fades out over it. One image leaves, the other is revealed; nothing is added.
        const out = Math.min(1, Math.max(0, (t - 7.0) / (BOARD_OUT - 7.0)))
        const rise = Math.min(1, Math.max(0, (t - CARD_IN) / (CARD_FULL - CARD_IN)))
        og.style.opacity = String(rise * rise * (3 - 2 * rise))
        board.style.opacity = String(1 - out)
        // Two slow orbits with different periods, so the light never repeats within the film and
        // never looks like it is on a loop. Small amplitudes: the card should breathe, not sway.
        const a = t * 0.42
        const b = t * 0.29
        ogBg.style.transform = `translate3d(${Math.sin(a) * 2.2}%, ${Math.cos(b) * 1.8}%, 0) scale(${1.06 + Math.sin(b * 0.7) * 0.015})`
        curtain.style.opacity = '0'
      }

      /* ------------------------------------------------------------------------------------
         Two clocks.
         In a browser the page runs on requestAnimationFrame, which is what a person watching it
         live should get. Under scripts/render-film.mjs the page is asked for a named moment
         instead, and every clip is seeked to that instant, so the output has one frame per
         output frame and nothing to duplicate.
         ------------------------------------------------------------------------------------ */

      const seekAll = async (t) => {
        await Promise.all(
          videos.map(
            (video) =>
              new Promise((resolve) => {
                const duration = video.duration || 6
                const to = Math.min(t % duration, duration - 0.04)
                if (Math.abs(video.currentTime - to) < 0.002) return resolve()
                const done = () => {
                  video.removeEventListener('seeked', done)
                  resolve()
                }
                video.addEventListener('seeked', done)
                // A seek that never lands must not hang the render; the frame still gets taken.
                setTimeout(done, 500)
                video.currentTime = to
              }),
          ),
        )
      }

      const ready = () => videos.every((v) => v.readyState >= 2)
      const wait = () => (ready() ? Promise.resolve() : new Promise((r) => setTimeout(wait, 40)))
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

      // '#t=7.4' freezes the camera there, for checking a composition without rendering the take.
      const freeze = /t=([\d.]+)/.exec(location.hash)
      const offline = location.hash.includes('render')

      // Place the camera immediately, before any clip is decodable. A still taken in the first
      // second then shows the right composition instead of black, and the real render only ever
      // takes frames after renderFrame() has resolved.
      place(freeze ? Number(freeze[1]) : 0)

      // Bounded, because a paused video is allowed to sit at metadata forever and a page that never
      // signals ready renders black — which cost an hour of guessing at the wrong bug once already.
      Promise.race([wait(), sleep(5000)]).then(() => {
        window.__filmReady = true

        if (offline) {
          for (const video of videos) video.pause()
          window.renderFrame = async (t) => {
            place(t)
            await seekAll(t)
          }
          place(0)
          return
        }

        for (const video of videos) video.play().catch(() => {})
        if (freeze) {
          const at = Number(freeze[1])
          place(at)
          seekAll(at)
          return
        }
        const started = performance.now()
        const tick = () => {
          place((performance.now() - started) / 1000)
          requestAnimationFrame(tick)
        }
        tick()
      })
    </script>
  </body>
</html>
